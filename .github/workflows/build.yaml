name: Build xlibre-keyring

on:
  push:
    branches: [xlibre]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create build user (makepkg refuses to run as root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel gnupg sudo

      - name: Build the keyring package
        run: su builder -c "makepkg -s --noconfirm"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: xlibre-keyring-package
          path: "*.pkg.tar.*"
